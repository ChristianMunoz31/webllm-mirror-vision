# Copy this file to a new GitHub repo at .github/workflows/mirror-raw.yml,
# then go to Actions â†’ "Mirror MLC model from Hugging Face (Raw)" â†’ Run workflow.
# After it finishes (~5â€“10 minutes for a 1B model), paste this URL into the
# app's Settings â†’ Model mirror:
#
#   https://raw.githubusercontent.com/<your-username>/<this-repo>/main/models
#
# Files will live at:
#   https://raw.githubusercontent.com/<user>/<repo>/main/models/<MODEL_ID>/<file>
#
# This workflow only works for models whose shards stay under GitHub's
# 100 MB raw-file limit â€” typically q4f16 variants. Use mirror-releases.yml
# for q4f32 or larger models.

name: Mirror MLC model from Hugging Face (Raw)
on:
  workflow_dispatch:
    inputs:
      hf_model_id:
        description: 'HF model ID (e.g. mlc-ai/SmolLM2-1.7B-Instruct-q4f16_1-MLC)'
        required: true
        default: 'mlc-ai/SmolLM2-1.7B-Instruct-q4f16_1-MLC'

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install git-lfs
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install

      - name: Clone HF model
        env:
          HF_ID: ${{ github.event.inputs.hf_model_id }}
        run: |
          rm -rf model
          git clone "https://huggingface.co/${HF_ID}" model
          cd model && git lfs pull && cd ..
          rm -rf model/.git
          # ${HF_ID#*/} strips the "mlc-ai/" prefix so the path matches the
          # WebLLM model_id exactly (e.g. SmolLM2-1.7B-Instruct-q4f16_1-MLC).
          mkdir -p "models/${HF_ID#*/}"
          mv model/* "models/${HF_ID#*/}/"
          rm -rf model

      - name: Commit & push (batched)
        env:
          HF_ID: ${{ github.event.inputs.hf_model_id }}
        run: |
          git config user.name "mirror-bot"
          git config user.email "actions@github.com"
          # A single ~3 GB push exceeds GitHub's HTTP endpoint timeout (~6 min)
          # and returns HTTP 500 mid-transfer. Batch the files into smaller
          # commits and push each â€” each batch transfers ~200-400 MB and
          # completes well under the timeout. Retry each push up to 3 times
          # in case of transient 500s.
          MODEL_DIR="models/${HF_ID#*/}"
          if [ ! -d "$MODEL_DIR" ]; then
            echo "Model directory $MODEL_DIR not found"
            exit 1
          fi
          BATCH_SIZE=8
          mapfile -t files < <(ls "$MODEL_DIR")
          total=${#files[@]}
          echo "Pushing $total files from $MODEL_DIR in batches of $BATCH_SIZE"
          batch_num=0
          for ((i=0; i<total; i+=BATCH_SIZE)); do
            batch_num=$((batch_num+1))
            batch=("${files[@]:i:BATCH_SIZE}")
            for f in "${batch[@]}"; do
              git add "$MODEL_DIR/$f"
            done
            if git diff --cached --quiet; then
              echo "Batch $batch_num: nothing to commit, skipping"
              continue
            fi
            git commit -m "Mirror ${HF_ID} (batch $batch_num)"
            # Retry push up to 3 times for transient HTTP 500s
            for attempt in 1 2 3; do
              if git push; then
                echo "Batch $batch_num pushed on attempt $attempt"
                break
              fi
              if [ "$attempt" = "3" ]; then
                echo "Batch $batch_num failed after 3 attempts"
                exit 1
              fi
              echo "Batch $batch_num push attempt $attempt failed, sleeping 15s"
              sleep 15
            done
          done
          echo "All $batch_num batches pushed successfully"
